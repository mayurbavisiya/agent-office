<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Agent Office</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dragbar" hidden><span>Agent Office</span><button id="hide-btn" type="button" title="Hide to tray" aria-label="Hide to tray">✕</button></div>
  <div id="strip" hidden></div>
  <div id="floor">
    <svg id="office" xmlns="http://www.w3.org/2000/svg" width="0" height="0" font-family="system-ui,-apple-system,sans-serif">
      <defs>
        <clipPath id="scr1"><rect x="-22" y="-62" width="44" height="28" rx="2"/></clipPath>
        <pattern id="planks" width="120" height="30" patternUnits="userSpaceOnUse">
          <rect width="120" height="30" fill="#d6b38a"/><path d="M0 29.5H120M60 0V30" stroke="#c49d72" stroke-width="1.5"/>
        </pattern>
      </defs>
      <g id="rooms"></g>
    </svg>
  </div>
  <aside id="panel" class="panel" hidden aria-label="Agent details"></aside>
  <div id="empty">Waiting for Claude Code sessions…</div>
  <div id="conn" hidden>disconnected · reconnecting…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
