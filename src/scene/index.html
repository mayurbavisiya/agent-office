<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Agent Office</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dragbar" hidden><span>Agent Office</span><button id="hide-btn" type="button" title="Hide to tray" aria-label="Hide to tray">✕</button></div>
  <div id="strip" hidden></div>
  <header id="usage" aria-label="Claude Code usage">
    <div class="u-ranges" role="group" aria-label="Range">
      <button type="button" data-range="today">Today</button><button type="button" data-range="week">Week</button><button type="button" data-range="month">Month</button><button type="button" data-range="custom">Custom</button>
    </div>
    <span class="u-custom" hidden><input type="date" id="u-from" aria-label="From"><span aria-hidden="true">→</span><input type="date" id="u-to" aria-label="To"></span>
    <div class="u-stats" aria-live="polite">
      <span class="u-cost" title="What this usage would cost at Anthropic API prices"><b id="u-cost">—</b> est. cost</span>
      <span title="All tokens processed, cache reads included"><b id="u-tok">—</b> tokens</span>
      <span title="Output tokens the models wrote"><b id="u-out">—</b> written</span>
      <span class="u-cache"><b id="u-cw">—</b> cache write · <b id="u-cr">—</b> cache read</span>
      <span id="u-note" class="u-note"></span>
    </div>
    <button type="button" id="u-more" aria-expanded="false" aria-controls="usage-details">Details ▾</button>
  </header>
  <div id="usage-details" hidden></div>
  <div id="floor">
    <svg id="office" xmlns="http://www.w3.org/2000/svg" width="0" height="0" font-family="system-ui,-apple-system,sans-serif">
      <defs>
        <clipPath id="scr1"><rect x="48" y="-44" width="26" height="14" rx="1"/></clipPath>
        <pattern id="planks" width="120" height="30" patternUnits="userSpaceOnUse">
          <rect width="120" height="30" fill="#d6b38a"/><path d="M0 29.5H120M60 0V30" stroke="#c49d72" stroke-width="1.5"/>
        </pattern>
      </defs>
      <g id="rooms"></g>
    </svg>
  </div>
  <aside id="panel" class="panel" hidden aria-label="Agent details"></aside>
  <div id="empty">Waiting for Claude Code sessions…</div>
  <div id="conn" hidden>disconnected · reconnecting…</div>
  <script type="module" src="main.js"></script>
</body>
</html>
